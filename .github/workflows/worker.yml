name: Julkaise backend (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # schema.sql käyttää IF NOT EXISTS -lauseita, joten sen ajaminen joka julkaisulla on turvallista.
      - name: Päivitä tietokannan skeema
        run: npx wrangler d1 execute paapelin-kirjanpito --remote --file=schema.sql -y
      - name: Julkaise Worker
        run: npx wrangler deploy
